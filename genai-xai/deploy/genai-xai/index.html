<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generative Explainable AI in Education — Survey Companion</title>
<meta name="description" content="Interactive companion to a survey of generative AI and explainability in education: 48 full-text-reviewed papers coded against six research questions and eight analytical dimensions.">
<meta property="og:type" content="article">
<meta property="og:title" content="Generative Explainable AI in Education — Survey Companion">
<meta property="og:description" content="48 papers, six research questions, eight coded dimensions.">
<meta name="theme-color" content="#2b2622">
<style>
:root{
  --bg:#f7f7f5; --panel:#fff; --ink:#1a1a18; --ink2:#55524c; --ink3:#8a857c;
  --line:#e2ded6; --line2:#cfc9be; --accent:#7a4b2a; --accent2:#a9713f;
  --p:#7a4b2a; --s:#c9a227; --c:#d9d3c7; --n:#f1eee8;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;line-height:1.25;margin:0}
a{color:var(--accent);text-decoration:none;border-bottom:1px solid rgba(122,75,42,.3)}
a:hover{border-bottom-color:var(--accent)}
.wrap{max-width:1060px;margin:0 auto;padding:0 26px}

header.top{background:linear-gradient(180deg,#2b2622,#3a332c);color:#f4f1ea;padding:26px 0 0}
header.top .kicker{font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:#a9713f;font-weight:700}
header.top h1{font-size:26px;color:#fff;margin:7px 0 0;max-width:860px;letter-spacing:-.2px}
header.top .sub{color:#c5bdb0;font-size:13.5px;margin-top:8px;max-width:760px}
nav.tabs{display:flex;gap:1px;margin-top:22px;flex-wrap:wrap}
nav.tabs button{background:transparent;border:0;border-bottom:3px solid transparent;color:#b6ada0;font:inherit;font-size:13.5px;font-weight:500;padding:10px 13px;cursor:pointer;transition:.15s;white-space:nowrap}
nav.tabs button:hover{color:#fff}
nav.tabs button.on{color:#fff;border-bottom-color:var(--accent2)}
nav.tabs .sep{width:1px;background:#4a4239;margin:6px 8px}

main{padding:24px 0 70px}
section.view{display:none;animation:fade .22s ease}
section.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px 24px;margin-bottom:16px}
.card>h2{font-size:17.5px;margin-bottom:3px}
.card>.note{color:var(--ink3);font-size:13px;margin:0 0 16px;max-width:740px}

.rqhead{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px 24px;margin-bottom:16px}
.rqhead .k{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent2);font-weight:700}
.rqhead h2{font-size:23px;margin:7px 0 0;max-width:780px}
.rqhead .cov{display:flex;gap:26px;margin-top:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink3)}
.rqhead .cov b{color:var(--ink);font-size:19px;font-family:var(--serif);display:block;line-height:1.1}

.answer{font-size:16px;line-height:1.6;border-left:3px solid var(--accent);padding:2px 0 2px 16px;font-family:var(--serif)}
.call{background:#fdf6ee;border:1px solid #f0e2d0;border-radius:9px;padding:14px 17px;margin-top:15px;font-size:13.8px;line-height:1.6;color:var(--ink2)}
.call b{color:var(--ink)}
ol.f{margin:0;padding:0;list-style:none;counter-reset:n}
ol.f li{counter-increment:n;position:relative;padding:9px 0 9px 32px;border-bottom:1px solid #f2efe9;font-size:14px;color:var(--ink2)}
ol.f li:last-child{border-bottom:0}
ol.f li:before{content:counter(n);position:absolute;left:0;top:9px;width:21px;height:21px;border-radius:50%;background:#f0ece5;color:var(--accent);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}

.bar{display:grid;grid-template-columns:var(--lw,250px) 1fr 42px;gap:14px;align-items:center;padding:7px 0;border-radius:6px}
.bar.clk{cursor:pointer}
.bar.clk:hover{background:#faf8f4}
.bar .lab{text-align:right;font-size:13.2px;line-height:1.3}
.bar .lab b{display:block;color:var(--ink);font-weight:600}
.bar.clk:hover .lab b{color:var(--accent)}
.bar .lab span{font-size:11.4px;color:var(--ink3)}
.track{background:#f1eee8;border-radius:4px;height:19px;overflow:hidden}
.fill{height:100%;border-radius:4px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.val{font-variant-numeric:tabular-nums;font-weight:600;font-size:13.5px}
.sbar{display:flex;height:20px;border-radius:4px;overflow:hidden;background:var(--n)}
.sbar span{display:block;height:100%}
.legend{display:flex;gap:15px;flex-wrap:wrap;font-size:12.3px;color:var(--ink2);margin-top:13px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2.5px;margin-right:6px;vertical-align:-1px}

.subh{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink3);font-weight:700;margin:20px 0 9px}
.def{padding:12px 0;border-bottom:1px solid var(--line)}
.def:last-child{border-bottom:0}
.dh{display:flex;gap:9px;align-items:baseline}
.code{color:#fff;font-weight:700;font-size:11px;padding:2px 8px;border-radius:5px;flex:none}
.dh b{font-size:14px}
.dh .n{margin-left:auto;font-size:12px;color:var(--ink3);font-weight:600;white-space:nowrap}
.def p{margin:5px 0 0;font-size:13.2px;color:var(--ink2);line-height:1.5}

table.ct{border-collapse:collapse;width:100%;font-size:13px}
table.ct th,table.ct td{border:1px solid var(--line);padding:7px;text-align:center}
table.ct thead th{background:#faf8f4;font-weight:600;font-size:11.5px;color:var(--ink2);vertical-align:bottom}
table.ct thead th span{font-weight:400;font-size:10px;color:var(--ink3);display:block}
table.ct th.rl{text-align:left;min-width:220px;font-size:12.8px;font-weight:600}
td.v{font-variant-numeric:tabular-nums;font-weight:600;cursor:pointer}
td.v.z{color:#d5cfc4;cursor:default;font-weight:400}
td.tot,tr.totrow th{background:#faf8f4;color:var(--ink2);font-weight:600}
.ctwrap{overflow-x:auto}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:16px}
.stat{background:var(--panel);padding:15px 17px}
.stat .n{font-family:var(--serif);font-size:29px;font-weight:600;line-height:1;color:var(--accent)}
.stat .l{font-size:11.3px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;margin-top:6px;font-weight:500}
.concl .c{padding:14px 0;border-bottom:1px solid var(--line)}
.concl .c:last-child{border-bottom:0}
.concl .c h4{font-size:14.5px;margin-bottom:4px}
.concl .c p{margin:0;font-size:13.4px;color:var(--ink2);line-height:1.6}

.plist{display:flex;flex-direction:column;gap:11px}
.paper{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:15px 18px}
.paper .hd{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.paper .hd .sid{font-family:var(--serif);font-size:13px;font-weight:700;color:var(--accent);padding-top:2px;min-width:44px}
.paper h4{font-size:15px;line-height:1.35;margin-bottom:4px}
.paper .au{font-size:12.8px;color:var(--ink2)}
.paper .ol{font-size:13.1px;color:var(--ink2);margin-top:7px;font-style:italic;line-height:1.5}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.chip{display:inline-block;padding:2.5px 9px;border-radius:20px;font-size:11.3px;font-weight:600;background:#f0ede7;color:#5b564d;white-space:nowrap}
.chip.yr{background:#eceef1;color:#4a5568}
.paper .caret{color:var(--ink3);font-size:12px;padding-top:4px;transition:.2s;margin-left:auto}
.paper.open .caret{transform:rotate(90deg)}
.paper .exp{display:none;margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
.paper.open .exp{display:block}
.rqrow{display:grid;grid-template-columns:74px 1fr;gap:12px;padding:8px 0;border-bottom:1px solid #f2efe9;font-size:13.2px;line-height:1.5}
.rqrow:last-child{border-bottom:0}
.mini{display:inline-flex;width:19px;height:19px;border-radius:4px;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;flex:none}
.mini.P{background:var(--p);color:#fff}.mini.S{background:var(--s);color:#3a2f00}
.mini.C{background:var(--c);color:#6a6459}.mini.X{background:var(--n);color:#c3bdb2}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 14px;font-size:13px;margin-top:13px}
.kv dt{color:var(--ink3);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
.kv dd{margin:0;color:var(--ink2)}
.ctl{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.ctl input[type=search],.ctl select{font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line2);border-radius:7px;background:#fff;color:var(--ink)}
.ctl input[type=search]{min-width:250px}
.btn{font:inherit;font-size:12.8px;padding:7px 12px;border:1px solid var(--line2);background:#fff;border-radius:7px;cursor:pointer;color:var(--ink2)}
.btn:hover{background:#f2efe9;color:var(--ink)}
.count{font-size:12.8px;color:var(--ink3);margin-left:auto}

.modal{position:fixed;inset:0;background:rgba(26,26,24,.55);display:none;align-items:center;justify-content:center;padding:24px;z-index:60}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:12px;max-width:700px;width:100%;max-height:84vh;overflow:auto;padding:24px 26px;position:relative}
.modal .x{position:absolute;top:12px;right:14px;border:0;background:#f2efe9;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:15px;color:var(--ink2)}
.modal dt{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);font-weight:700;margin-top:13px}
.modal dd{margin:3px 0 0;font-size:13.8px;color:var(--ink2);line-height:1.55}
.row{padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover{background:#faf8f4}
.tt{position:fixed;background:#2b2622;color:#f4f1ea;padding:7px 11px;border-radius:6px;font-size:12.2px;pointer-events:none;opacity:0;transition:opacity .12s;z-index:70;max-width:300px;line-height:1.45}
.tt.on{opacity:1}
.dimpick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.dimpick label{display:inline-flex;align-items:center;gap:5px;font-size:12.3px;padding:5px 10px;border:1px solid var(--line2);border-radius:20px;cursor:pointer;background:#fff;color:var(--ink2);user-select:none}
.dimpick label:hover{background:#f7f5f0}
.dimpick label.on{background:var(--accent);border-color:var(--accent);color:#fff}
.dimpick input{display:none}
.sk .lnk{opacity:.42;cursor:pointer;transition:opacity .15s}
.sk.focus .lnk{opacity:.10}
.sk.focus .lnk.hi{opacity:.72}
.sk .nd rect{cursor:pointer}
.sk.focus .nd{opacity:.35}
.sk.focus .nd.hi{opacity:1}
.sk .stg{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;fill:var(--ink3)}
.sk .nlab{font-size:10.5px;font-weight:600;fill:var(--ink)}
.sk .nsub{font-size:9.5px;fill:var(--ink3)}
.empty{padding:40px;text-align:center;color:var(--ink3);font-size:14px}

/* ---- view toggle ---- */
.vt{display:inline-flex;border:1px solid var(--line2);border-radius:7px;overflow:hidden}
.vt button{font:inherit;font-size:12.8px;padding:7px 14px;border:0;background:#fff;cursor:pointer;color:var(--ink3)}
.vt button.on{background:var(--accent);color:#fff}
/* ---- paper matrix ---- */
table.mx{border-collapse:separate;border-spacing:0;font-size:12.5px;width:100%}
table.mx th,table.mx td{padding:5px 6px;text-align:center;border-bottom:1px solid #f0ece5;white-space:nowrap}
table.mx thead th{position:sticky;top:0;background:var(--panel);z-index:3;color:var(--ink2);font-weight:600;
  border-bottom:2px solid var(--line2);font-size:10.5px}
table.mx th.gh{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);
  border-bottom:1px solid var(--line);background:#faf8f4;font-weight:700}
table.mx th.sm{font-size:10px;font-weight:600;color:var(--ink3);padding-bottom:6px}
table.mx th.l,table.mx td.stick.l{position:sticky;left:0;background:var(--panel);z-index:2;text-align:left;padding-left:8px}
table.mx th.l2,table.mx td.stick.l2{position:sticky;left:46px;background:var(--panel);z-index:2;text-align:left}
table.mx thead th.l,table.mx thead th.l2{z-index:4}
table.mx td.ttl{max-width:330px;overflow:hidden;text-overflow:ellipsis;color:var(--ink);font-size:12.4px}
table.mx td.yr{color:var(--ink3);font-size:11.5px}
table.mx tbody tr:hover td{background:#faf8f4}
table.mx tbody tr:hover td.stick{background:#faf8f4}
.idl{font-weight:700;color:var(--accent);cursor:pointer;font-size:11.8px}
.idl:hover{text-decoration:underline}
.cchip{display:inline-block;min-width:30px;padding:2px 5px;border-radius:4px;color:#fff;font-weight:700;font-size:10.5px;letter-spacing:.02em}
table.mx td.cd,table.mx td.st{cursor:pointer}
table.mx td.cd:hover .cchip{filter:brightness(1.15)}
footer{border-top:1px solid var(--line);padding:22px 0 44px;color:var(--ink3);font-size:12.4px}
svg text{font-family:var(--sans)}
@media(max-width:700px){.bar{grid-template-columns:1fr;gap:5px}.bar .lab{text-align:left}}
</style>
</head>

-032-29744-0_15", "fulltext": "https://doi.org/10.1007/978-3-032-29744-0_15", "evidenceType": "Technical evaluation + classroom field study", "reviewStatus": "Full text reviewed", "reviewedVersion": "Official Springer AIED 2026 full-paper PDF", "primaryRQ": "RQ1, RQ2, RQ3, RQ4, RQ5, RQ6", "codes": {"RQ1": "P", "RQ2": "P", "RQ4": "P", "RQ3": "P", "RQ5": "P", "RQ6": "P"}, "detail": {"RQ1": "Formative feedback on open-ended data-visualisation narratives in an introductory undergraduate data science course.", "RQ2": "Explains why each sentence is classified as surface-level ‘show’ or interpretive ‘tell’, highlighting terms intended to support revision and sense-making.", "RQ4": "Students inspect labels, highlighted terms and rationales, indicate agreement and complete structured reflection prompts.", "RQ3": "A classifier assigns labels, sentence-transformer similarity identifies key terms, and GPT-4o generates pedagogical explanations from the sentence and label.", "RQ5": "Combines expert validation of classification, highlighting and explanation relevance with a seven-week pilot involving 33 students and 1,381 sentences.", "RQ6": "Emphasises calibrated trust and critical engagement, while acknowledging moderate highlighting reliability, explanation inconsistency and limited generalisability."}, "dim": {"k": "K2", "o": "O1", "p": "P1", "a": "A2", "st": "ST1", "iu": "IU1", "ev": "EV1", "rk": "RK3"}, "rat": {"c": "The learner-facing rationale is directly generated by an LLM to explain a feedback classification.", "k": "The system provides formative feedback on students’ open-ended narrative interpretations of visualisations.", "o": "The explanation accompanies a show/tell judgement and identifies linguistic evidence in the student response.", "p": "Explanations and reflection prompts aim to improve sense-making, metacognitive awareness and feedback literacy.", "a": "Structured classification and embedding-derived key terms are combined with an LLM-generated pedagogical ra /* ---- tooltip ---- */
const tt=$('#tt');
function tip(el,html){
  el.addEventListener('mouseenter',()=>{tt.innerHTML=html;tt.classList.add('on')});
  el.addEventListener('mousemove',e=>{const r=tt.getBoundingClientRect();
    let x=e.clientX+14,y=e.clientY+14;
    if(x+r.width>innerWidth-10)x=e.clientX-r.width-14;
    if(y+r.height>innerHeight-10)y=e.clientY-r.height-14;
    tt.style.left=x+'px';tt.style.top=y+'px'});
  el.addEventListener('mouseleave',()=>tt.classList.remove('on'));
}

function distBars(dk,onClick){
  const d=DK[dk], f=cnt(PAPERS,p=>p.dim[dk]), mx=Math.max(...d.defs.map(c=>f[c.code]||0));
  const html=d.defs.map(c=>{const n=f[c.code]||0;
    return `<div class="bar clk" data-cat="${dk}|${c.code}" style="--lw:262px">
      <div class="lab"><b>${c.code} · ${esc(c.label)}</b><span>${Math.round(n/N*100)}% of corpus</span></div>
      <div class="track"><div class="fill" style="width:${mx?n/mx*100:0}%;background:${d.colors[c.code]}"></div></div>
      <div class="val">${n}</div></div>`}).join('');
  return html;
}
function bindDist(root){
  $$('.bar[data-cat]',root).forEach(el=>{
    const [dk,code]=el.dataset.cat.split('|');
    tip(el,`<b>${code} · ${esc(lab[code])}</b><br>${esc(rule[code])}`);
    el.onclick=()=>{const ids=PAPERS.filter(p=>p.dim[dk]===code).map(p=>p.id);
      listModal(ids,`${code} · ${esc(lab[code])}`,`${ids.length} papers — ${esc(rule[code])}`)};
  });
}
function crossTab(xk,yk){
  const R=DK[xk],C=DK[yk];
  const cells={}; PAPERS.forEach(p=>{const k=p.dim[xk]+'|'+p.dim[yk];(cells[k]=cells[k]||[]).push(p.id)});
  const mx=Math.max(...Object.values(cells).map(v=>v.length));
  const ths=C.defs.map(c=>`<th title="${esc(c.label)}">${c.code}<span>${esc(SH(c.code))}</span></th>`).join('');
  const rows=R.defs.map(r=>{
    const tds=C.defs.map(c=>{const ids=cells[r.code+'|'+c.code]||[],n=ids.length;
      const a=n?0.10+0.72*(n/mx):0;
      return n?`<td class="v" data-x="${xk}|${r.code}|${yk}|${c.code}" style="background:rgba(169,113,63,${a.toFixed(3)});color:${a>.5?'#fff':'var(--ink)'}">${n}</td>`
              :`<td class="v z">—</td>`}).join('');
    const tot=PAPERS.filter(p=>p.dim[xk]===r.code).length;
    return `<tr><th class="rl">${r.code} · ${esc(r.label)}</th>${tds}<td class="tot">${tot}</td></tr>`}).join('');
  const tot=C.defs.map(c=>`<td class="tot">${PAPERS.filter(p=>p.dim[yk]===c.code).length}</td>`).join('');
  return `<div class="ctwrap"><table class="ct"><thead><tr><th class="rl">${esc(R.name)} <span style="font-weight:400;color:var(--ink3)">(${R.rq})</span></th>${ths}<th>Total</th></tr></thead>
   <tbody>${rows}<tr class="totrow"><th class="rl">Total</th>${tot}<td class="tot">${N}</td></tr></tbody></table></div>`;
}
function bindCross(root){
  $$('td.v[data-x]',root).forEach(td=>{
    const [xk,rc,yk,cc]=td.dataset.x.split('|');
    const ids=X(xk,rc,yk,cc);
    tip(td,`<b>${rc} × ${cc}</b> — ${ids.length} paper${ids.length>1?'s':''}<br><span style="color:#c5bdb0">${esc(lab[rc])}<br>× ${esc(lab[cc])}</span>`);
    td.onclick=()=>listModal(ids,`${esc(lab[rc])} &nbsp;×&nbsp; ${esc(lab[cc])}`,`${ids.length} paper${ids.length>1?'s':''}`);
  });
}

function stackedByYear(dk){
  const d=DK[dk],W=740,H=250,pad={t:14,r:10,b:38,l:36};
  const bw=Math.min(78,(W-pad.l-pad.r)/YEARS.length-16),plotH=H-pad.t-pad.b,step=(W-pad.l-pad.r)/YEARS.length;
  const data=YEARS.map(y=>{const ps=PAPERS.filter(p=>p.year===y);
    return{y,total:ps.length,seg:d.defs.map(c=>({c,n:ps.filter(p=>p.dim[dk]===c.code).length}))}});
  const mx=Math.max(...data.map(x=>x.total));
  let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">`;
  [...new Set(Array.from({length:6},(_,i)=>Math.round(mx*i/5)))].forEach(t=>{const yy=pad.t+plotH-t/mx*plotH;
    s+=`<line x1="${pad.l}" x2="${W-pad.r}" y1="${yy}" y2="${yy}" stroke="#e8e4dc"/><text x="${pad.l-7}" y="${yy+4}" font-size="10" fill="#8a857c" text-anchor="end">${t}</text>`});
  data.forEach((x,i)=>{const px=pad.l+step*i+(step-bw)/2;let acc=0;
    x.seg.forEach(sg=>{if(!sg.n)return;const hh=sg.n/mx*plotH,yy=pad.t+plotH-acc-hh;acc+=hh;
      s+=`<rect class="seg" x="${px}" y="${yy}" width="${bw}" height="${hh}" fill="${d.colors[sg.c.code]}" data-sg="${dk}|${sg.c.code}|${x.y}|${sg.n}|${x.total}"/>`;
      if(hh>14)s+=`<text x="${px+bw/2}" y="${yy+hh/2+4}" font-size="10" fill="#fff" text-anchor="middle" font-weight="600" pointer-events="none">${sg.n}</text>`});
    s+=`<text x="${px+bw/2}" y="${H-pad.b+17}" font-size="11.5" fill="#55524c" text-anchor="middle" font-weight="600">${x.y}</text>
        <text x="${px+bw/2}" y="${H-pad.b+30}" font-size="10" fill="#8a857c" text-anchor="middle">n=${x.total}</text>`});
  return s+'</svg>'+`<div class="legend">${d.defs.map(c=>`<span><i style="background:${d.colors[c.code]}"></i>${c.code} · ${esc(SH(c.code))}</span>`).join('')}</div>`;
}

const NOTE={
 RQ1:'The educational setting whose outputs are being explained.',
 RQ2:'Two dimensions: what the explanation is about, and what it is meant to enable.',
 RQ3:'How the explanation is produced — three near-equal architectures encode three different theories of how a generated explanation earns belief.',
 RQ4:'Two dimensions: who the explanation is designed for, and what they may do with it.',
 RQ5:'What each paper’s evidence principally establishes.',
 RQ6:'The dominant risk concern each paper raises.'};
function rqView(rq){
  const r=rqInfo(rq),cov=r.cov||{},im=META.implic[rq]||{},ds=dimsOf(rq);
  let h=`<div class="rqhead"><div class="k">Research question ${rq[2]} of ${META.rqs.length}</div><h2>${esc(r.q)}</h2>
    <div class="cov"><div><b>${cov.P||0}</b>primary contribution</div><div><b>${cov.S||0}</b>substantive</div>
    <div><b>${cov.C||0}</b>mentioned in passing</div><div><b>${N}</b>papers in corpus</div></div></div>
   <div class="card"><h2>The short answer</h2><p class="answer">${esc(r.answer||'')}</p>
    ${im.implication?`<div class="call"><b>What this means:</b> ${esc(im.implication)}</div>`:''}</div>
   <div class="card"><h2>What we found</h2><ol class="f">${(r.findings||[]).map(f=>`<li>${esc(f)}</li>`).join('')}</ol></div>`;
  ds.forEach(d=>{
    h+=`<div class="card"><h2>${esc(d.name)}</h2>
      <p class="note">${esc(NOTE[rq]||'')} Hover any bar for the rule used; click for the papers.</p>

    h+=`<div class="card"><h2>How architectures are distributed across the window</h2>
      <p class="note">The corpus spans 2024–2026. Three years is too short to read as a trend; the shares are reported for description, not trajectory.</p>
      ${stackedByYear('a')}</div>`}
  const cx=CROSS[rq];
  if(cx){
    h+=`<div class="card"><h2>${esc(cx.title)}</h2>

}

/* ---- interpretive callouts, computed from the data ---- */
const nA=c=>PAPERS.filter(p=>p.dim.a===c).length;
const CALL={
 RQ2:`<b>Assessment and analytics dominate — and are tested differently.</b> Assessment work concentrates
  in technical evaluation, while analytics work carries most of the learning-outcome evidence. The two largest
  settings in the field are not accumulating the same kind of evidence.`,
 RQ3:`<b>Traceability is treated as a grading obligation.</b> Every paper that makes the evidence behind an
  output traceable is explaining an assessment judgement. Across the ${X('o',['O2','O3','O4'],'p',['P1','P2','P3','P4']).length}
  papers explaining analytics, predictions or recommendations, none does the same — even though the techniques would transfer.`,
 RQ4:`<b>Learners receive explanations; they do not shape them.</b> Across every learner-facing paper, none
  gives learners a role in configuring, correcting or contesting what the system says. Where explanatory authority
  is shared, an educator holds it.`,
 RQ5:`<b>The field has not converged.</b> Three architectures are near-equally represented and encode
  incompatible theories of where explanatory credibility comes from: fluency is sufficient, credibility is
  inherited from an interpretable component, or credibility must be constructed through grounding and oversight.`,
 RQ6:`<b>Read the shaded rows against the dashes.</b> Direct generation and grounded construction —
  ${nA('A1')+nA('A3')} papers between them — are never evaluated for learning outcomes. Conversational explanation,
  evaluated for learning in ${X('a','A4','ev','EV3').length} of its ${nA('A4')} papers, is never evaluated for technical quality.
  The systems we know to be faithful and the systems we know to help someone are not the same systems.`,
 RQ6:`<b>The dominant risk is not the one being measured.</b> Papers whose central concern is faithfulness
  evaluate technically and almost never measure what a learner does afterwards; papers concerned with overreliance
  and human agency do the reverse. Establishing that an explanation is persuasively unfaithful needs both halves
  of that evidence about one system.`};

const SK_DEF=['c','k','o','p']; let skStages=[...SK_DEF];
function initSankey(){
  $('#skPick').innerHTML=DIMS.map(d=>`<label data-k="${d.k}" class="${skStages.includes(d.k)?'on':''}">
    <input type="checkbox" ${skStages.includes(d.k)?'checked':''}>${esc(d.short)}</label>`).join('');
  $$('#skPick label').forEach(l=>l.onclick=e=>{e.preventDefault();
    const k=l.dataset.k,i=skStages.indexOf(k);
    if(i>-1){if(skStages.length<=2){flash('Keep at least two dimensions.');return}skStages.splice(i,1)}
    else{if(skStages.length>=5){flash('Five is the readable maximum.');return}
      skStages.push(k);skStages.sort((a,b)=>DIMS.findIndex(d=>d.k===a)-DIMS.findIndex(d=>d.k===b))}
    sync();drawSankey()});
  $('#skReset').onclick=()=>{skStages=[...SK_DEF];sync();drawSankey()};
  sync();drawSankey();
}
const sync=()=>$$('#skPick label').forEach(l=>{const on=skStages.includes(l.dataset.k);
  l.classList.toggle('on',on);l.querySelector('input').checked=on});
function flash(msg){const e=$('#skCount');e.textContent=msg;e.style.color='var(--accent)';
  clearTimeout(e._t);e._t=setTimeout(()=>{e.style.color='';e.textContent=`${N} papers · ${skStages.length} stages`},1800)}
function drawSankey(){
  const st=skStages.map(k=>DK[k]),W=980,padT=38,padB=12,padL=6,padR=6,NW=12;
  const plotH=Math.max(340,st.length*80+200),H=plotH+padT+padB,gap=8;
  const cols=st.map((d,si)=>{const f=cnt(PAPERS,p=>p.dim[d.k]),defs=d.defs.filter(c=>(f[c.code]||0)>0);
    const avail=plotH-gap*(defs.length-1);let y=padT;
    return defs.map(c=>{const n=f[c.code],h=n/N*avail,o={d,si,code:c.code,label:c.label,n,y0:y,y1:y+h,
      x:padL+si*((W-padL-padR-NW)/(st.length-1)),color:d.colors[c.code]};y+=h+gap;return o})});
  const idx=cols.map(col=>Object.fromEntries(col.map(n=>[n.code,n])));
  const links=[];
  for(let i=0;i<st.length-1;i++){const A=st[i].k,B=st[i+1].k,mp={};
    PAPERS.forEach(p=>{const k=p.dim[A]+'|'+p.dim[B];(mp[k]=mp[k]||[]).push(p.id)});
    const src={},tgt={};
    const es=Object.entries(mp).map(([k,ids])=>{const[a,b]=k.split('|');
      return{a,b,ids,ai:cols[i].findIndex(n=>n.code===a),bi:cols[i+1].findIndex(n=>n.code===b)}})
      .filter(e=>e.ai>-1&&e.bi>-1);
    es.sort((x,y)=>x.ai-y.ai||x.bi-y.bi);
    es.forEach(e=>{const a=idx[i][e.a];src[e.a]=(src[e.a]||a.y0);
      e.sy0=src[e.a];e.sy1=e.sy0+e.ids.length/a.n*(a.y1-a.y0);src[e.a]=e.sy1});
    [...es].sort((x,y)=>x.bi-y.bi||x.ai-y.ai).forEach(e=>{const b=idx[i+1][e.b];tgt[e.b]=(tgt[e.b]||b.y0);
      e.ty0=tgt[e.b];e.ty1=e.ty0+e.ids.length/b.n*(b.y1-b.y0);tgt[e.b]=e.ty1});
    es.forEach(e=>links.push({...e,stage:i,x0:idx[i][e.a].x+NW,x1:idx[i+1][e.b].x,color:idx[i][e.a].color}))}
  let s=`<svg class="sk" viewBox="0 0 ${W} ${H}" style="width:100%;min-width:740px;height:auto">`;
  st.forEach((d,i)=>{const x=padL+i*((W-padL-padR-NW)/(st.length-1));
    const an=i===0?'start':i===st.length-1?'end':'middle',tx=i===0?x:i===st.length-1?x+NW:x+NW/2;
    s+=`<text class="stg" x="${tx}" y="14" text-anchor="${an}">${esc(d.rq)}</text>
        <text class="stg" x="${tx}" y="27" text-anchor="${an}" style="fill:var(--ink2);font-size:11px;letter-spacing:.02em;text-transform:none">${esc(d.short)}</text>`});
  links.forEach((l,i)=>{const xm=(l.x0+l.x1)/2;
    s+=`<path class="lnk" data-l="${i}" fill="${l.color}" d="M${l.x0},${l.sy0} C${xm},${l.sy0} ${xm},${l.ty0} ${l.x1},${l.ty0} L${l.x1},${l.ty1} C${xm},${l.ty1} ${xm},${l.sy1} ${l.x0},${l.sy1} Z"/>`});
  cols.forEach((col,si)=>col.forEach(n=>{const last=si===st.length-1;
    const tx=last?n.x-5:n.x+NW+5,an=last?'end':'start';
    s+=`<g class="nd" data-n="${si}|${n.code}"><rect x="${n.x}" y="${n.y0}" width="${NW}" height="${Math.max(n.y1-n.y0,1.5)}" rx="2.5" fill="${n.color}"/>
      <text class="nlab" x="${tx}" y="${(n.y0+n.y1)/2-1}" text-anchor="${an}">${esc(SH(n.code))}</text>
      <text class="nsub" x="${tx}" y="${(n.y0+n.y1)/2+10}" text-anchor="${an}">${n.n}</text></g>`}));
  s+='</svg>'; $('#skOut').innerHTML=s;
  const g=$('#skOut .sk');
  $$('.lnk',g).forEach(e=>{const l=links[+e.dataset.l];
    tip(e,`<b>${esc(SH(l.a))} → ${esc(SH(l.b))}</b> — ${l.ids.length} paper${l.ids.length>1?'s':''}`);
    e.onmouseenter=()=>{g.classList.add('focus');e.classList.add('hi');
      $$(`[data-n="${l.stage}|${l.a}"],[data-n="${l.stage+1}|${l.b}"]`,g).forEach(x=>x.classList.add('hi'))};
    e.onmouseleave=()=>{g.classList.remove('focus');$$('.hi',g).forEach(x=>x.classList.remove('hi'))};
    e.onclick=()=>listModal(l.ids,`${esc(lab[l.a])} → ${esc(lab[l.b])}`,`${l.ids.length} paper${l.ids.length>1?'s':''}`)});
  $$('.nd',g).forEach(e=>{const[si,code]=e.dataset.n.split('|'),d=st[+si],n=idx[+si][code];
    tip(e,`<b>${code} · ${esc(n.label)}</b><br>${n.n} of ${N} papers<br><span style="color:#c5bdb0">click to list</span>`);
    e.onmouseenter=()=>{g.classList.add('focus');e.classList.add('hi');
      const ids=new Set(PAPERS.filter(p=>p.dim[d.k]===code).map(p=>p.id));
      links.forEach((l,i)=>{if(l.ids.some(x=>ids.has(x))){$(`[data-l="${i}"]`,g).classList.add('hi');
        $$(`[data-n="${l.stage}|${l.a}"],[data-n="${l.stage+1}|${l.b}"]`,g).forEach(x=>x.classList.add('hi'))}})};
    e.onmouseleave=()=>{g.classList.remove('focus');$$('.hi',g).forEach(x=>x.classList.remove('hi'))};
    e.onclick=()=>listModal(PAPERS.filter(p=>p.dim[d.k]===code).map(p=>p.id),`${code} · ${esc(n.label)}`,rule[code])});
  $('#skCount').textContent=`${N} papers · ${st.length} stages`;
  g.dataset.check=JSON.stringify(st.map((d,i)=>cols[i].reduce((a,n)=>a+n.n,0)));
}
/* ================= router ================= */
const VIEWS=[{id:'overview',label:'Overview'},...RQS.map(r=>({id:r,label:r})),{id:'papers',label:'Papers'}];
function go(id){
  $$('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===id));
  const main=$('#main');
  main.innerHTML=`<section class="view on">${
    id==='overview'?overview():id==='papers'?papersView():rqView(id)}</section>`;
  if(id==='overview')bindOverview();
  else if(id==='papers')bindPapers();
  else{bindDist(main);bindCross(main);bindSeg(main)}
  scrollTo({top:0,behavior:'smooth'});
}
$('#tabs').innerHTML=VIEWS.map((v,i)=>
  (i===1||i===8?'<span class="sep"></span>':'')+`<button data-v="${v.id}">${v.label}</button>`).join('');
$$('#tabs button').forEach(b=>b.onclick=()=>go(b.dataset.v));
$('#hdrSub').textContent=META.subtitle;
$('#foot').innerHTML=`${N} papers, ${YEARS[0]}–${YEARS[YEARS.length-1]}, each read in full and coded against
 ${META.rqs.length===6?'six':'seven'} research questions and ${DIMS.length} dimensions (${DIMS.reduce((a,d)=>a+d.defs.length,0)} categories).
 Every figure is computed at load time from the embedded coding — no hard-coded totals.
 Self-contained: no external scripts, styles or network requests.`;
go('overview');

</script>
</body></html>
